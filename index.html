<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista do Chá de Casa Nova</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #c0c0c0;
  text-align: center;
  overflow-x: hidden;
}

/* Banner */
.banner {
  padding: 10px 0;
}

.banner img {
  width: 100%;
  max-width: 900px;
  height: auto;
  border-radius: 12px;
}

/* Container padrão (PC) */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 20px;
  padding: 40px 20px;
  max-width: 900px;
  margin: 0 auto;
}

/* Item box */
.item-box {
  background: #ffffff;
  width: 85%;
  padding: 1px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: 0.3s ease;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
  justify-self: end;
}

.item-box:hover {
  transform: translateY(-5px);
}

.item-box img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}

.item-box h3 {
  margin: 15px 0;
  font-size: 20px;
  color: #333;
  font-weight: 600;
}

button {
  width: 100%;
  background: linear-gradient(45deg, #ff4d6d, #ff758f);
  border: none;
  color: white;
  padding: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  border-radius: 8px;
}

button:hover {
  opacity: 0.9;
}

/* MODAL NOME */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.confirm-box {
  background: white;
  padding: 30px;
  width: 320px;
  border-radius: 14px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  text-align: center;
  animation: aparecer 0.25s ease;
}

.confirm-box input {
  width: 100%;
  padding: 10px;
  margin-top: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

.botoes {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

.cancelar {
  background: #ccc;
  color: #333;
}

.confirmar {
  background: linear-gradient(45deg, #ff4d6d, #ff758f);
}

/* POPUP CARICATURA */
.caricatura-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9998;
}

.caricatura-box {
  background: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  max-width: 90%;
  max-height: 90vh;
  overflow: auto;
}

.caricatura-box img {
  width: 100%;
  max-width: 220px;
  height: auto;
}

.success-msg {
  margin-top: 15px;
  background: #28a745;
  color: white;
  padding: 10px;
  border-radius: 10px;
  font-weight: bold;
}

@keyframes aparecer {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* RESPONSIVO CELULAR */
@media (max-width: 600px) {
  .banner img {
    max-width: 90%;
  }
  .container {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
    max-width: 500px;
    margin: 0 auto;
  }
  .item-box {
    padding: 12px;
  }
  .item-box img {
    height: 110px;
  }
  .item-box h3 {
    font-size: 15px;
  }
  button {
    padding: 8px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="banner">
  <img src="henrique.png" alt="Chá de Casa Nova">
</div>

<div class="container">
  <!-- TODOS OS ITENS ESTÁTICOS -->
  <div class="item-box">
    <img src="airfryeer.jpg">
    <h3>Air Fryer</h3>
    <button onclick="reservar(this)" ontouchstart="reservar(this)">Reservar</button>
  </div>

  <div class="item-box">
    <img src="jogodepanela.webp">
    <h3>Jogo de Panelas</h3>
    <button onclick="reservar(this)" ontouchstart="reservar(this)">Reservar</button>
  </div>

  <div class="item-box">
    <img src="batedeira.webp">
    <h3>Batedeira</h3>
    <button onclick="reservar(this)" ontouchstart="reservar(this)">Reservar</button>
  </div>

  <!-- Repita o mesmo padrão para todos os seus outros itens -->
  <!-- ... -->
  <!-- Exemplo: -->
  <div class="item-box">
    <img src="jogodetaças.webp">
    <h3>Jogo de Taças</h3>
    <button onclick="reservar(this)" ontouchstart="reservar(this)">Reservar</button>
  </div>
  <div class="item-box">
    <img src="jogodetalheres.webp">
    <h3>Jogo de Talheres</h3>
    <button onclick="reservar(this)" ontouchstart="reservar(this)">Reservar</button>
  </div>

  <!-- Continue adicionando todos os itens do seu HTML original -->
</div>

<!-- Modal Nome -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h2>Confirmar Reserva</h2>
    <p>Digite seu nome para reservar:</p>
    <input type="text" id="nomeInput" placeholder="Seu nome">
    <div class="botoes">
      <button class="cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="confirmar" onclick="confirmarReserva()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Popup Caricatura -->
<div class="caricatura-overlay" id="caricaturaOverlay">
  <div class="caricatura-box">
    <img src="caricatura.png">
    <div class="success-msg">✔ Item reservado com sucesso!</div>
  </div>
</div>

<script>
let botaoSelecionado = null;

function reservar(botao) {
  botaoSelecionado = botao;
  document.getElementById("confirmOverlay").style.display = "flex";
}

function fecharModal() {
  document.getElementById("confirmOverlay").style.display = "none";
  document.getElementById("nomeInput").value = "";
}

function confirmarReserva() {
  const nome = document.getElementById("nomeInput").value.trim();

  if (nome === "") {
    alert("Por favor, digite seu nome para confirmar.");
    return;
  }

  botaoSelecionado.disabled = true;
  botaoSelecionado.innerText = "Reservado";
  botaoSelecionado.style.background = "#777";
  botaoSelecionado.style.cursor = "not-allowed";

  fecharModal();

  const overlay = document.getElementById("caricaturaOverlay");
  overlay.style.display = "flex";

  setTimeout(() => {
    overlay.style.display = "none";
  }, 2000);
}
</script>

</body>
</html>
