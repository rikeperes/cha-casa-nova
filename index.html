<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista do Chá de Casa Nova</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #c0c0c0;
  text-align: center;
  overflow-x: hidden;
}

/* Banner */
.banner {
  padding: 10px 0;
}

.banner img {
  width: 100%;
  max-width: 900px;
  height: auto;
  border-radius: 12px;
}

/* Container */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 20px;
  padding: 40px 20px;
  max-width: 900px;
  margin: 0 auto;
}

/* Item box */
.item-box {
  background: #ffffff;
  width: 85%;
  padding: 1px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: 0.3s ease;
  box-shadow: 0 3px 8px rgba(0,0,0,0.08);
  justify-self: end;
}

.item-box:hover {
  transform: translateY(-5px);
}

.item-box img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}

.item-box h3 {
  margin: 15px 0;
  font-size: 20px;
  color: #333;
  font-weight: 600;
}

button {
  width: 100%;
  background: linear-gradient(45deg, #ff4d6d, #ff758f);
  border: none;
  color: white;
  padding: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  border-radius: 8px;
}

button:hover {
  opacity: 0.9;
}

/* Modal Nome */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  display: none;
  justify-content: center;
  align-items: center;
}

.confirm-box {
  background: white;
  padding: 30px;
  width: 320px;
  border-radius: 14px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  text-align: center;
  animation: aparecer 0.25s ease;
}

.confirm-box input {
  width: 100%;
  padding: 10px;
  margin-top: 15px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}

.botoes {
  margin-top: 20px;
  display: flex;
  gap: 10px;
}

.cancelar {
  background: #ccc;
  color: #333;
}

.confirmar {
  background: linear-gradient(45deg, #ff4d6d, #ff758f);
}

/* Popup Caricatura */
.caricatura-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  display: none;
  justify-content: center;
  align-items: center;
}

.caricatura-box {
  background: white;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  max-width: 90%;
  max-height: 90vh;
  overflow: auto;
}

.caricatura-box img {
  width: 100%;
  max-width: 220px;
  height: auto;
}

.success-msg {
  margin-top: 15px;
  background: #28a745;
  color: white;
  padding: 10px;
  border-radius: 10px;
  font-weight: bold;
}

@keyframes aparecer {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* RESPONSIVO CELULAR */
@media (max-width: 600px) {

  .banner img {
    max-width: 90%;
  }

  .container {
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
    max-width: 500px;
    margin: 0 auto;
  }

  .item-box {
    width: 100% !important;
    padding: 10px !important;
    box-sizing: border-box;
  }

  .item-box img {
    height: 110px;
  }

  .item-box h3 {
    font-size: 15px;
  }

  button {
    width: 100% !important;
    padding: 12px !important;
    font-size: 14px !important;
  }
}
</style>
</head>
<body>

<div class="banner">
  <img src="henrique.png" alt="Chá de Casa Nova">
</div>

<div class="container" id="itemsContainer">
  <!-- Itens vão ser carregados pelo JS para evitar problemas de mobile -->
</div>

<!-- Modal Nome -->
<div class="overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h2>Confirmar Reserva</h2>
    <p>Digite seu nome para reservar:</p>
    <input type="text" id="nomeInput" placeholder="Seu nome">
    <div class="botoes">
      <button class="cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="confirmar" onclick="confirmarReserva()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Popup Caricatura -->
<div class="caricatura-overlay" id="caricaturaOverlay">
  <div class="caricatura-box">
    <img src="caricatura.png">
    <div class="success-msg">✔ Item reservado com sucesso!</div>
  </div>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://jjudsjfgrtmmorhgqijl.supabase.co",
  "sb_publishable_YWmcJUQoL9OnB-ylEzOy6w_pE5rEMrL"
);

// Lista de itens
const itens = [
  { nome: "Air Fryer", img: "airfryeer.jpg" },
  { nome: "Jogo de Panelas", img: "jogodepanela.webp" },
  { nome: "Batedeira", img: "batedeira.webp" },
  { nome: "Jogo de Taças", img: "jogodetaças.webp" },
  { nome: "Jogo de Talheres", img: "jogodetalheres.webp" },
  { nome: "Jogo de Cama", img: "jogodecama.webp" },
  { nome: "Toalha", img: "toalha.webp" },
  { nome: "Cesto de Roupas", img: "cestoderoupa.webp" },
  { nome: "Pano de Prato", img: "panosdeprato.webp" },
  { nome: "Cesto de Lixo", img: "cestodelixo.jpg" },
  { nome: "Afiador de Faca", img: "afiadordefaca.jpg" },
  { nome: "Aspirador de Pó", img: "aspiradordepo.webp" },
  { nome: "Assadeira", img: "Assadeira.webp" },
  { nome: "Assadeira de Vidro", img: "assadeiradevidro.webp" },
  { nome: "Boleira", img: "boleira.webp" },
  { nome: "Cadeira de Praia", img: "cadeiradepraia.webp" },
  { nome: "Cafeteira", img: "cafeteira.jpg" },
  { nome: "Chaleira de Indução", img: "chaleirainduçao.jpg" },
  { nome: "Colher de Silicone", img: "Colher de silicone.jfif" },
  { nome: "Copo Medidor", img: "copomedidor.webp" },
  { nome: "Jogo de Copos", img: "coposvidro.webp" },
  { nome: "Escorredor de Macarrão", img: "escorredordemacarrao.jpg" },
  { nome: "Escova para Vaso Sanaitário", img: "escovaparavasosanitario.webp" },
  { nome: "Espetos", img: "espetos.webp" },
  { nome: "Esteira Porta Copos de sofá", img: "esteiraportacoposofa.jpg" },
  { nome: "Ferro de Passar", img: "ferrodepassar.webp" },
  { nome: "Forma para Pão", img: "formadepao.jfif" },
  { nome: "Forma Pudim", img: "formadepudim.webp" },
  { nome: "Forma Redonda", img: "formaredonda.jpg" },
  { nome: "Frigideira", img: "frigideira.webp" },
  { nome: "Fue", img: "fue.webp" },
  { nome: "Garrafa Termica", img: "garrafatermica.jpg" },
  { nome: "Jarra de Vidro", img: "jarradevidro.jpg" },
  { nome: "Jogo de Facas", img: "Jogo de facas.jfif" },
  { nome: "Jogo para Sobremesa", img: "jogodesobremesa.png" },
  { nome: "Kit de silicone p/Cozinha", img: "kit silicone cozinha.webp" },
  { nome: "Kit Xicara", img: "kitchicara.webp" },
  { nome: "Kit Lençol", img: "kitlençol.jpg" },
  { nome: "Kit para Churrasco", img: "kitparachurasco.webp" },
  { nome: "Microondas", img: "Microondas.webp" },
  { nome: "Mixer", img: "mixer.webp" },
  { nome: "Porta Talheres", img: "Porta talheres.webp" },
  { nome: "Porta Sabonete", img: "portasabonete.webp" },
  { nome: "Pote para Frios", img: "potefrios.webp" },
  { nome: "Pote Hermetico", img: "potehermetrico.webp" },
  { nome: "Jogo de Pratos", img: "Pratos.webp" },
  { nome: "Purificador de Agua", img: "purificadordeagua.webp" },
  { nome: "Toalha de Mesa", img: "toalhademesa.webp" },
  { nome: "Toalha de Rosto", img: "toalharosto.webp" },
  { nome: "Torradeira/Grill", img: "torradeira.webp" },
  { nome: "Varal de Chão", img: "varaldechao.jpg" },
  { nome: "Vaso Decorativo", img: "vasodecorativo.webp" },
];

// Função para renderizar itens e bloquear os reservados
let botaoSelecionado = null;

async function carregarItens() {
  // Pega reservas existentes
  const { data: reservas, error } = await supabase
    .from("reservas")
    .select("item");

  const container = document.getElementById("itemsContainer");
  container.innerHTML = "";

  itens.forEach(it => {
    const div = document.createElement("div");
    div.className = "item-box";

    const img = document.createElement("img");
    img.src = it.img;
    div.appendChild(img);

    const h3 = document.createElement("h3");
    h3.textContent = it.nome;
    div.appendChild(h3);

    const btn = document.createElement("button");
    btn.textContent = "Reservar";

    // Verifica se já está reservado
    if (reservas?.some(r => r.item === it.nome)) {
      btn.disabled = true;
      btn.textContent = "Reservado";
      btn.style.background = "#777";
      btn.style.cursor = "not-allowed";
    } else {
      btn.addEventListener("click", () => reservar(btn, it.nome));
    }

    div.appendChild(btn);
    container.appendChild(div);
  });
}

// Modal functions
function reservar(botao, itemNome) {
  botaoSelecionado = { botao, itemNome };
  const overlay = document.getElementById("confirmOverlay");
  overlay.style.display = "flex";
  overlay.scrollIntoView({ behavior: "smooth", block: "center" });
}

function fecharModal() {
  document.getElementById("confirmOverlay").style.display = "none";
  document.getElementById("nomeInput").value = "";
}

async function confirmarReserva() {
  const nome = document.getElementById("nomeInput").value.trim();

  if (!nome) {
    alert("Por favor, digite seu nome para confirmar.");
    return;
  }

  // Inserir no Supabase
  const { error } = await supabase
    .from("reservas")
    .insert([{ item: botaoSelecionado.itemNome, nome: nome }]);

  if (error) {
    alert("Erro ao reservar: " + error.message);
    return;
  }

  fecharModal();

  // Mostrar popup
  const overlay = document.getElementById("caricaturaOverlay");
  overlay.style.display = "flex";
  setTimeout(() => overlay.style.display = "none", 2000);

  // Recarrega itens para bloquear reservados
  carregarItens();
}

// Inicializa
carregarItens();
</script>

</body>
</html>
